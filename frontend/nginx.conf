server {
  # 8080, not 80: an unprivileged nginx cannot bind a port below 1024.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Local-compose only: proxy /api to the backend service over the compose network.
  # On ECS the ALB does this instead (see ApiListenerRule) and this block is inert.
  location /api/ {
    resolver 127.0.0.11 valid=10s;          # Docker's embedded DNS
    set $backend http://backend:3000;        # variable → resolved per-request, not at startup
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;     # forward the session cookie to Nest
    proxy_pass_header Set-Cookie;             # return Set-Cookie on login
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}