AWSTemplateFormatVersion: '2010-09-09'
Description: 'login-demo Stage 4 — ECS/Fargate two services (frontend + backend) behind an ALB with path routing, Redis session store, plus CloudWatch observability (dashboard + alarms -> SNS). EPHEMERAL: delete-stack when done. Imports its VPC/subnets from the durable login-demo-network stack.'

Parameters:
  BackendImageTag:
    Type: String
    Default: 'latest'
    Description: 'Image tag for the BACKEND service (e.g. latest or the backend git SHA).'
  FrontendImageTag:
    Type: String
    Default: 'latest'
    Description: 'Image tag for the FRONTEND service (e.g. latest or the frontend git SHA). Each service has its OWN tag — a frontend commit SHA is not a valid backend tag.'
  NotificationEmail:
    Type: String
    Default: ''
    Description: 'Email address for CloudWatch alarm notifications. Leave BLANK to create the SNS topic with no subscription (alarms still fire, just nowhere to deliver). If set, AWS emails a confirmation link you must click before alerts arrive.'
  EnableExec:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: 'Enable ECS Exec (shell into a running backend task). Break-glass — leave false unless actively debugging.'
  NetworkStackName:
    Type: String
    Default: 'login-demo-network'
    Description: 'Name of the durable network foundation stack to import the VPC/subnets from. Templates should not assume sibling stack names — this parameterizes the cross-stack reference.'

  DataStackName:
    Type: String
    Default: 'login-demo-data'
    Description: 'Name of the data stack to import the DB endpoint, secret, and client SG from.'

Conditions:
  # Only create the email subscription when an address was actually provided.
  # The topic and alarms exist either way; this just controls delivery.
  HasEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:

  # ===================== Network =====================
  # The VPC, subnets, IGW, and routing now live in the durable `login-demo-network`
  # stack (zero idle cost, deploy-once). This stack imports them via Fn::ImportValue
  # so the app can be created/destroyed freely without touching the network.
  # Idiom: `Fn::ImportValue` (long form) wrapping `!Sub` (shorthand) — the two
  # shorthand tags can't nest, so ImportValue must be long form here.

  # ===================== Security groups =====================
  LoadBalancerSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-alb'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupIngress:
        - CidrIp: '0.0.0.0/0'
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp

  # One SG for both services. Allows the ALB to reach frontend:80 and backend:3000.
  # A task only listens on its own port, so sharing the SG is fine.
  # NOTE: because it's shared, the RedisSecurityGroup rule below also admits the
  # frontend task to 6379. Harmless (nginx has no Redis client) but broader than
  # least-privilege — splitting into per-service SGs is a separate cleanup.
  ServiceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-service'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupIngress:
        - SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
        - SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          FromPort: 3000
          ToPort: 3000
          IpProtocol: tcp

  # ===================== Load balancer + routing =====================
  # No more DependsOn: VPCGatewayAttachment — the IGW is attached in the network
  # stack (already CREATE_COMPLETE), so the internet-facing ALB's requirement is met.
  LoadBalancer:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Scheme: 'internet-facing'
      IpAddressType: 'ipv4'
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # Default: everything -> frontend. (API split is a higher-priority rule below.)
  HttpListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # /api/* -> backend. Higher priority than the default, so it wins for API paths.
  ApiListenerRule:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - '/api/*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Port: 80
      Protocol: HTTP
      TargetType: ip                       # Fargate = register by task ENI IP
      HealthCheckPath: '/'                 # nginx serves index.html -> 200
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  BackendTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: '/api/auth/me'      # returns 200 {"user":null} -> healthy
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  # ===================== Redis (session store) =====================
  # Externalizes session state so the backend becomes stateless.
  # EPHEMERAL like everything else here: ~$0.016/hr for t4g.micro, so a
  # session costs pennies. Sessions are throwaway — losing the cache on
  # teardown is the intended behaviour, not a loss.

  # Which subnets ElastiCache may place the node in — imported from the network stack.
  RedisSubnetGroup:
    Type: 'AWS::ElastiCache::SubnetGroup'
    Properties:
      CacheSubnetGroupName: !Sub '${AWS::StackName}-redis'
      Description: 'Subnets ElastiCache may place the Redis node in.'
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # SG chaining: only things in ServiceSecurityGroup may reach 6379.
  # No password — in-VPC access control IS the security boundary here.
  # Nothing outside the VPC can route to it at all.
  RedisSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-redis'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupIngress:
        - SourceSecurityGroupId: !Ref ServiceSecurityGroup
          FromPort: 6379
          ToPort: 6379
          IpProtocol: tcp

  # Single-node Redis, cluster mode disabled. ReplicationGroup (not CacheCluster)
  # because CacheCluster's RedisEndpoint GetAtt rendered EMPTY on engine 7.1 —
  # collapsed REDIS_URL to "redis://:". ReplicationGroup's PrimaryEndPoint is
  # reliably populated and is AWS's current recommended path for Redis.
  # NumCacheClusters 1 = one primary, zero replicas. Still ~$0.016/hr, still
  # the slowest resource in the stack (~10-15 min to create).
  RedisReplicationGroup:
    Type: 'AWS::ElastiCache::ReplicationGroup'
    Properties:
      ReplicationGroupDescription: !Sub '${AWS::StackName} session store'
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false      # can't enable with a single node
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:                    # NOTE: not VpcSecurityGroupIds
        - !GetAtt RedisSecurityGroup.GroupId
      Port: 6379

  # ===================== Session signing secret =====================
  # The HMAC key express-session uses to sign the session cookie. It does NOT
  # hold session data (that's Redis) — it makes session IDs unforgeable.
  #
  # Every backend task MUST see the SAME value: a cookie signed by task A has to
  # verify on task B, or users appear randomly logged out as the ALB bounces
  # them. That's why this is a scaling prerequisite, not a nice-to-have.
  #
  # NOTE — deliberately NOT pinning `Name`. Secrets Manager keeps a deleted
  # secret for a 7-day recovery window, so a pinned name would collide on the
  # next create-stack after teardown ("scheduled for deletion"). A generated
  # name sidesteps that entirely, and nothing greps for this one.
  SessionSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Description: !Sub 'express-session signing key for ${AWS::StackName}'
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true          # keeps it shell/env-var safe

  # ===================== ECS cluster + shared execution role =====================
  Cluster:
    Type: 'AWS::ECS::Cluster'
    Properties:
      # Pinned name so the CloudWatch dashboard's ClusterName dimension is a known
      # literal (not a random suffix we'd have to GetAtt). NOTE: the CD pipeline's
      # locate step greps service/cluster ARNs for the substring 'login-demo-app-Cluster',
      # so this name MUST keep that exact casing/substring or deploys silently skip.
      ClusterName: !Sub '${AWS::StackName}-Cluster'

  # Execution role = what Fargate needs to START a task (pull image, ship logs,
  # and now resolve secrets). The AWS-managed policy grants exactly ECR pull +
  # CloudWatch logs — it does NOT cover Secrets Manager, hence the inline policy.
  # Without it a task fails to start with ResourceInitializationError.
  TaskExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: 'ecs-tasks.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: 'read-secrets'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource:
                  - !Ref SessionSecret
                  - Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'

  # Task role = what the RUNNING container assumes for its own AWS calls
  # (distinct from the execution role, which Fargate uses to START the task).
  # The app itself needs no AWS access; this exists solely so ECS Exec can
  # open its SSM messaging channel into the container.
  TaskRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: 'ecs-tasks.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'ecs-exec-ssm'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # ===================== Logs =====================
  BackendLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      RetentionInDays: 7

  FrontendLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      RetentionInDays: 7

  # ===================== Backend task + service =====================
  BackendTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: !Sub '${AWS::StackName}-backend'
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt 'TaskExecutionRole.Arn'
      TaskRoleArn: !GetAtt 'TaskRole.Arn'
      ContainerDefinitions:
        - Name: backend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/login-demo-backend:${BackendImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          # Environment = plaintext, visible in the console and in describe-task-definition.
          Environment:
            - Name: PORT
              Value: '3000'
            - Name: COOKIE_SECURE
              Value: 'false'
            - Name: REDIS_URL
              Value: !Sub 'redis://${RedisReplicationGroup.PrimaryEndPoint.Address}:${RedisReplicationGroup.PrimaryEndPoint.Port}'
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbEndpoint'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbName'
          # Secrets = resolved at task start by the EXECUTION role and injected as
          # env vars. The value never appears in the template, the console, or git.
          # The app reads it exactly like any other process.env value.
          Secrets:
            - Name: SESSION_SECRET
              ValueFrom: !Ref SessionSecret
            - Name: DB_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:password::'
                  - SecretArn:
                      Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref BackendLogGroup
              awslogs-stream-prefix: backend

  BackendService:
    DependsOn: ApiListenerRule
    Type: 'AWS::ECS::Service'
    Properties:
      # Pinned name -> deterministic ServiceName dimension for the dashboard.
      ServiceName: !Sub '${AWS::StackName}-BackendService'
      Cluster: !Ref Cluster
      # Sessions now live in Redis and all tasks share one signing secret, so
      # this is no longer forced to 1 — raise it once the single-task path is
      # verified, then prove sessions survive a bounce between tasks.
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: !Ref EnableExec
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref BackendTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 3000
          TargetGroupArn: !Ref BackendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: 'ENABLED'      # public subnet + public IP = no NAT gateway
          SecurityGroups:
            - !Ref ServiceSecurityGroup                              # ALB -> task (inbound)
            - Fn::ImportValue: !Sub '${DataStackName}-DbClientSgId'  # task -> DB (this is the client SG finally getting worn)
          Subnets:
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # ===================== Frontend task + service =====================
  FrontendTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: !Sub '${AWS::StackName}-frontend'
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt 'TaskExecutionRole.Arn'
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/login-demo-frontend:${FrontendImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref FrontendLogGroup
              awslogs-stream-prefix: frontend

  FrontendService:
    DependsOn: HttpListener
    Type: 'AWS::ECS::Service'
    Properties:
      # Pinned name -> deterministic ServiceName dimension AND keeps the CD locate
      # substring 'login-demo-app-FrontendService' intact.
      ServiceName: !Sub '${AWS::StackName}-FrontendService'
      Cluster: !Ref Cluster
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref FrontendTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: 'ENABLED'
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # ===================== Observability: SNS topic + email =====================
  # The topic is the fan-out point: alarms publish here, subscribers receive.
  # One topic, both alarms wired to it. Email is the only subscriber for now.
  AlarmTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'

  AlarmEmailSubscription:
    Condition: HasEmail
    Type: 'AWS::SNS::Subscription'
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ===================== Observability: alarms =====================
  # Alarm #1 — backend is UP but ERRORING. Fires when the backend returns more
  # than 5 HTTP 5xx responses in a single minute. Target 5xx = the app itself
  # threw 500s (a real bug), distinct from ALB 5xx (backend unreachable).
  # Metric is sparse (only emitted when 5xx happen) -> missing data = healthy.
  Backend5xxAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub '${AWS::StackName}-backend-5xx'
      AlarmDescription: 'Backend returned more than 5 HTTP 5xx responses in a minute.'
      Namespace: 'AWS/ApplicationELB'
      MetricName: 'HTTPCode_Target_5XX_Count'
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]        # also notify on recovery (all-clear email)

  # Alarm #2 — backend is DOWN / unhealthy. Fires when the backend target group
  # has zero healthy tasks for 3 straight minutes. This is the one that would
  # have caught your Stage 4 crash-loop and the health-check-path failures.
  BackendUnhealthyHostAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub '${AWS::StackName}-backend-unhealthy'
      AlarmDescription: 'Backend target group had no healthy tasks for 3 minutes.'
      Namespace: 'AWS/ApplicationELB'
      MetricName: 'HealthyHostCount'
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # ===================== Observability: dashboard =====================
  # A saved view of metrics that already exist (ECS + ALB emit these for free).
  # Session-scoped: created and destroyed with this ephemeral stack, so it shows
  # "is this session healthy right now", not long-term trends.
  Dashboard:
    Type: 'AWS::CloudWatch::Dashboard'
    Properties:
      DashboardName: !Sub '${AWS::StackName}-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Backend errors (5xx)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "backend target 5xx" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "ALB 5xx (502/503/504)" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Backend latency (TargetResponseTime, s)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Average", "label": "avg" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p90", "label": "p90" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p99", "label": "p99" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Healthy hosts per service",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Minimum", "label": "backend healthy" } ],
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${FrontendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Minimum", "label": "frontend healthy" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ECS CPU / Memory (%)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-BackendService", { "stat": "Average", "label": "backend CPU%" } ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-BackendService", { "stat": "Average", "label": "backend Mem%" } ],
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-FrontendService", { "stat": "Average", "label": "frontend CPU%" } ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-FrontendService", { "stat": "Average", "label": "frontend Mem%" } ]
                ]
              }
            }
          ]
        }

Outputs:
  URL:
    Description: 'App URL (frontend at /, backend at /api/*)'
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  RedisEndpoint:
    Description: 'Redis endpoint the backend connects to'
    Value: !Sub '${RedisReplicationGroup.PrimaryEndPoint.Address}:${RedisReplicationGroup.PrimaryEndPoint.Port}'
  SessionSecretArn:
    Description: 'Secrets Manager ARN holding the express-session signing key'
    Value: !Ref SessionSecret
  DashboardURL:
    Description: 'CloudWatch dashboard for this session'
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-dashboard'
  AlarmTopicArn:
    Description: 'SNS topic that both alarms publish to'
    Value: !Ref AlarmTopic