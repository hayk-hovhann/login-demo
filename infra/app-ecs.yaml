AWSTemplateFormatVersion: '2010-09-09'
Description: 'login-demo Stage 4 — ECS/Fargate two services (frontend + backend) behind an ALB with path routing, Redis session store, plus CloudWatch observability (dashboard + alarms -> SNS). EPHEMERAL: delete-stack when done. Imports its VPC/subnets from the durable login-demo-network stack.'

Parameters:
  BackendImageTag:
    Type: String
    Default: 'latest'
    Description: 'Image tag for the BACKEND service (e.g. latest or the backend git SHA).'
  FrontendImageTag:
    Type: String
    Default: 'latest'
    Description: 'Image tag for the FRONTEND service (e.g. latest or the frontend git SHA). Each service has its OWN tag — a frontend commit SHA is not a valid backend tag.'
  NotificationEmail:
    Type: String
    Default: ''
    Description: 'Email address for CloudWatch alarm notifications. Leave BLANK to create the SNS topic with no subscription (alarms still fire, just nowhere to deliver). If set, AWS emails a confirmation link you must click before alerts arrive.'
  EnableExec:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: 'Enable ECS Exec (shell into a running backend task). Break-glass — leave false unless actively debugging.'
  NetworkStackName:
    Type: String
    Default: 'login-demo-network'
    Description: 'Name of the durable network foundation stack to import the VPC/subnets from. Templates should not assume sibling stack names — this parameterizes the cross-stack reference.'

  DataStackName:
    Type: String
    Default: 'login-demo-data'
    Description: 'Name of the data stack to import the DB endpoint, secret, and client SG from.'

  RegistrationEnabled:
    Type: String
    Default: 'true'
    AllowedValues: [ 'true', 'false' ]
    Description: 'Allow POST /api/auth/register. Defaults TRUE on purpose: each session starts from a fresh or snapshot-restored DB with no seeding path on ECS, so the frontend Register tab is the only way in — and parameters omitted on update-stack revert to the TEMPLATE DEFAULT, so a forgotten flag stays harmless. Flip to false to demonstrate the gate.'

  CertificateArn:
    Type: String
    Default: ''
    Description: 'ACM certificate ARN for the HTTPS listener. BLANK = HTTP only (the pre-TLS behaviour, unchanged). Set it and the stack grows a 443 listener, redirects 80 -> 443, and flips COOKIE_SECURE to true. Deploy is two-phase by nature: the cert must cover the ALB DNS name, which does not exist until the stack does — bring the stack up blank, then ./infra/make-cert.sh, then update-stack with the ARN it prints. WARNING: update-stack reverts any omitted parameter to the TEMPLATE DEFAULT, so a later update that forgets this one silently tears TLS back down (and with it the secure cookie). Pass CertificateArn,UsePreviousValue=true on every subsequent update-stack, exactly like NotificationEmail. `aws cloudformation deploy` does not have this failure mode — it preserves unspecified parameters.'

Conditions:
  # Only create the email subscription when an address was actually provided.
  # The topic and alarms exist either way; this just controls delivery.
  HasEmail: !Not [!Equals [!Ref NotificationEmail, '']]

  # TLS is opt-in via parameter rather than a separate template, so the HTTP-only
  # and HTTPS shapes are the SAME stack — no recreate, no second code path to rot.
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:

  # ===================== Network =====================
  # The VPC, subnets, IGW, and routing now live in the durable `login-demo-network`
  # stack (zero idle cost, deploy-once). This stack imports them via Fn::ImportValue
  # so the app can be created/destroyed freely without touching the network.
  # Idiom: `Fn::ImportValue` (long form) wrapping `!Sub` (shorthand) — the two
  # shorthand tags can't nest, so ImportValue must be long form here.

  # ===================== Security groups =====================
  LoadBalancerSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-alb'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      # 80 stays open even with TLS on — it serves the 301 to HTTPS, which is the
      # whole point of a redirect listener. !If returns the WHOLE list here: a
      # single ingress entry cannot be conditionally omitted from a list in place.
      SecurityGroupIngress: !If
        - HasCertificate
        - - CidrIp: '0.0.0.0/0'
            FromPort: 80
            ToPort: 80
            IpProtocol: tcp
          - CidrIp: '0.0.0.0/0'
            FromPort: 443
            ToPort: 443
            IpProtocol: tcp
        - - CidrIp: '0.0.0.0/0'
            FromPort: 80
            ToPort: 80
            IpProtocol: tcp

  # One SG for both services. Allows the ALB to reach frontend:80 and backend:3000.
  # A task only listens on its own port, so sharing the SG is fine.
  # NOTE: because it's shared, the RedisSecurityGroup rule below also admits the
  # frontend task to 6379. Harmless (nginx has no Redis client) but broader than
  # least-privilege — splitting into per-service SGs is a separate cleanup.
  ServiceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-service'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupIngress:
        - SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
        - SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          FromPort: 3000
          ToPort: 3000
          IpProtocol: tcp

  # ===================== Load balancer + routing =====================
  # No more DependsOn: VPCGatewayAttachment — the IGW is attached in the network
  # stack (already CREATE_COMPLETE), so the internet-facing ALB's requirement is met.
  LoadBalancer:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Scheme: 'internet-facing'
      IpAddressType: 'ipv4'
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # THE listener that serves the app. It moves ports rather than being duplicated:
  #   no cert -> 80/HTTP     cert -> 443/HTTPS
  # One listener means ONE /api/* rule and one DependsOn chain. The alternative —
  # a permanent HTTP listener plus a conditional HTTPS one — forces the rule to be
  # declared twice, and then BackendService's `DependsOn` has to name a resource
  # that may not exist. DependsOn takes no intrinsic functions, so that shape is
  # not expressible; cfn-lint E3005 catches it.
  #
  # Port and Protocol both update in place on an existing listener, so flipping a
  # live stack from HTTP to HTTPS is an update, not a replacement.
  #
  # TLS terminates HERE. ALB -> task traffic stays plain HTTP inside the VPC (both
  # target groups are Protocol: HTTP), so the containers need no cert and no code
  # change. That split is exactly why `trust proxy` is load-bearing in the backend:
  # Express sees an http:// connection and would refuse to set a `secure` cookie
  # without being told to believe X-Forwarded-Proto.
  AppListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If [HasCertificate, 443, 80]
      Protocol: !If [HasCertificate, HTTPS, HTTP]
      # TLS 1.2 floor, TLS 1.3 offered. Anything older is long past end-of-life.
      # AWS::NoValue drops the property entirely — an HTTP listener rejects both
      # SslPolicy and Certificates, so they cannot be left as empty strings.
      SslPolicy: !If
        - HasCertificate
        - 'ELBSecurityPolicy-TLS13-1-2-2021-06'
        - !Ref 'AWS::NoValue'
      Certificates: !If
        - HasCertificate
        - - CertificateArn: !Ref CertificateArn
        - !Ref 'AWS::NoValue'
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # Only exists alongside TLS: port 80 stops serving the app and 301s to HTTPS.
  # The redirect is the listener's DEFAULT action and there are no rules above it,
  # so it covers /api/* too. A 301 makes most clients re-issue a POST as a GET, so
  # plain-HTTP API calls fail loudly rather than half-working.
  HttpRedirectListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  # /api/* -> backend. Higher priority than the default, so it wins for API paths.
  ApiListenerRule:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref AppListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - '/api/*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Port: 80
      Protocol: HTTP
      TargetType: ip                       # Fargate = register by task ENI IP
      HealthCheckPath: '/'                 # nginx serves index.html -> 200
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  BackendTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      # Liveness only, and deliberately never touches Postgres — that is what
      # lets tasks go healthy BEFORE the migration task has run.
      # NOT /api/auth/me: AuthenticatedGuard makes it 403 when anonymous, which
      # is outside the matcher below, so no task could ever register healthy.
      HealthCheckPath: '/api/health'
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  # ===================== Redis (session store) =====================
  # Externalizes session state so the backend becomes stateless.
  # EPHEMERAL like everything else here: ~$0.016/hr for t4g.micro, so a
  # session costs pennies. Sessions are throwaway — losing the cache on
  # teardown is the intended behaviour, not a loss.

  # Which subnets ElastiCache may place the node in — imported from the network stack.
  RedisSubnetGroup:
    Type: 'AWS::ElastiCache::SubnetGroup'
    Properties:
      CacheSubnetGroupName: !Sub '${AWS::StackName}-redis'
      Description: 'Subnets ElastiCache may place the Redis node in.'
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
        - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # Empty membership badge, mirroring DbClientSecurityGroup in data.yaml: holds no
  # rules itself, and attaching it is what grants reach to 6379 (the rule lives on
  # RedisSecurityGroup below, evaluated on the receiving side). Exists so the
  # bastion can tunnel a GUI client to Redis WITHOUT widening the Postgres badge
  # to a second port — one SG per access intent, so "may reach Redis" never rides
  # along with "may reach Postgres".
  RedisClientSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-redis-client (attach to anything that needs Redis)'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'

  # SG chaining: only things in ServiceSecurityGroup or RedisClientSecurityGroup
  # may reach 6379. No password — in-VPC access control IS the security boundary
  # here. Nothing outside the VPC can route to it at all.
  RedisSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub '${AWS::StackName}-redis'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcId'
      SecurityGroupIngress:
        - SourceSecurityGroupId: !Ref ServiceSecurityGroup
          FromPort: 6379
          ToPort: 6379
          IpProtocol: tcp
        - SourceSecurityGroupId: !Ref RedisClientSecurityGroup
          FromPort: 6379
          ToPort: 6379
          IpProtocol: tcp

  # Single-node Redis, cluster mode disabled. ReplicationGroup (not CacheCluster)
  # because CacheCluster's RedisEndpoint GetAtt rendered EMPTY on engine 7.1 —
  # collapsed REDIS_URL to "redis://:". ReplicationGroup's PrimaryEndPoint is
  # reliably populated and is AWS's current recommended path for Redis.
  # NumCacheClusters 1 = one primary, zero replicas. Still ~$0.016/hr, still
  # the slowest resource in the stack (~10-15 min to create).
  RedisReplicationGroup:
    Type: 'AWS::ElastiCache::ReplicationGroup'
    # Explicit and deliberate: this stack is EPHEMERAL, so everything in it goes
    # on teardown. Contrast infra/data.yaml, where the DB is Snapshot — that is
    # the one thing worth keeping. Sessions are disposable by design.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ReplicationGroupDescription: !Sub '${AWS::StackName} session store'
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false      # can't enable with a single node
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:                    # NOTE: not VpcSecurityGroupIds
        - !GetAtt RedisSecurityGroup.GroupId
      Port: 6379

  # ===================== Session signing secret =====================
  # The HMAC key express-session uses to sign the session cookie. It does NOT
  # hold session data (that's Redis) — it makes session IDs unforgeable.
  #
  # Every backend task MUST see the SAME value: a cookie signed by task A has to
  # verify on task B, or users appear randomly logged out as the ALB bounces
  # them. That's why this is a scaling prerequisite, not a nice-to-have.
  #
  # NOTE — deliberately NOT pinning `Name`. Secrets Manager keeps a deleted
  # secret for a 7-day recovery window, so a pinned name would collide on the
  # next create-stack after teardown ("scheduled for deletion"). A generated
  # name sidesteps that entirely, and nothing greps for this one.
  SessionSecret:
    Type: 'AWS::SecretsManager::Secret'
    # Delete on teardown. Secrets Manager still holds it for a 7-day recovery
    # window, which is exactly why `Name` above is left unpinned.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'express-session signing key for ${AWS::StackName}'
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true          # keeps it shell/env-var safe

  # ===================== ECS cluster + shared execution role =====================
  Cluster:
    Type: 'AWS::ECS::Cluster'
    Properties:
      # Pinned name so the CloudWatch dashboard's ClusterName dimension is a known
      # literal (not a random suffix we'd have to GetAtt). NOTE: the CD pipeline's
      # locate step greps service/cluster ARNs for the substring 'login-demo-app-Cluster',
      # so this name MUST keep that exact casing/substring or deploys silently skip.
      ClusterName: !Sub '${AWS::StackName}-Cluster'

  # Execution role = what Fargate needs to START a task (pull image, ship logs,
  # and now resolve secrets). The AWS-managed policy grants exactly ECR pull +
  # CloudWatch logs — it does NOT cover Secrets Manager, hence the inline policy.
  # Without it a task fails to start with ResourceInitializationError.
  TaskExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: 'ecs-tasks.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: 'read-secrets'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource:
                  - !Ref SessionSecret
                  - Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'

  # Task role = what the RUNNING container assumes for its own AWS calls
  # (distinct from the execution role, which Fargate uses to START the task).
  # The app itself needs no AWS access; this exists solely so ECS Exec can
  # open its SSM messaging channel into the container.
  TaskRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: 'ecs-tasks.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'ecs-exec-ssm'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # ===================== Logs =====================
  BackendLogGroup:
    Type: 'AWS::Logs::LogGroup'
    # Logs die with the stack — retention is 7 days anyway, and keeping
    # orphaned log groups around is a silent CloudWatch cost.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: 7

  FrontendLogGroup:
    Type: 'AWS::Logs::LogGroup'
    # Logs die with the stack — retention is 7 days anyway, and keeping
    # orphaned log groups around is a silent CloudWatch cost.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: 7

  MigrateLogGroup:
    Type: 'AWS::Logs::LogGroup'
    # Logs die with the stack — retention is 7 days anyway, and keeping
    # orphaned log groups around is a silent CloudWatch cost.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: 7

  # ===================== Migration task (run on demand) =====================
  # NOT a Service — nothing runs until you `aws ecs run-task` it; see the
  # MigrateCommand output for the ready-made invocation. Task definitions are
  # free to define; only running tasks bill.
  #
  # Deliberately NOT an init container on the backend task: a failed migration
  # there blocks task start, which trips the deployment circuit breaker, whose
  # rollback deletes the logs you need to diagnose it. A standalone task stops
  # cleanly and keeps its log stream and exit code.
  #
  # The image tag derives from BackendImageTag so schema and the code that
  # depends on it always come from the same commit.
  MigrateTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: !Sub '${AWS::StackName}-migrate'
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities: [ FARGATE ]
      ExecutionRoleArn: !GetAtt 'TaskExecutionRole.Arn'
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/login-demo-backend:migrate-${BackendImageTag}'
          Essential: true
          Environment:
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbEndpoint'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbName'
          Secrets:
            - Name: DB_USER
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:username::'
                  - SecretArn:
                      Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:password::'
                  - SecretArn:
                      Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref MigrateLogGroup
              awslogs-stream-prefix: migrate

  # ===================== Backend task + service =====================
  BackendTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: !Sub '${AWS::StackName}-backend'
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt 'TaskExecutionRole.Arn'
      TaskRoleArn: !GetAtt 'TaskRole.Arn'
      ContainerDefinitions:
        - Name: backend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/login-demo-backend:${BackendImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          # Environment = plaintext, visible in the console and in describe-task-definition.
          Environment:
            - Name: PORT
              Value: '3000'
            # Derived from the listener shape rather than set by hand, so the
            # flag can never drift from the actual transport. `secure` cookies
            # over plain HTTP are simply never sent back by the browser, which
            # looks exactly like a broken login — so this is not a knob worth
            # exposing as its own parameter.
            - Name: COOKIE_SECURE
              Value: !If [HasCertificate, 'true', 'false']
            - Name: REDIS_URL
              Value: !Sub 'redis://${RedisReplicationGroup.PrimaryEndPoint.Address}:${RedisReplicationGroup.PrimaryEndPoint.Port}'
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbEndpoint'
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbPort'
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub '${DataStackName}-DbName'
            # RDS runs with rds.force_ssl=1 (the Postgres 16 system default), but
            # node-postgres defaults to a PLAINTEXT socket — PrismaPg passes only
            # host/port/database/user/password and no `ssl` key. RDS then rejects
            # at the pg_hba stage with "no encryption", which surfaces through
            # Prisma as P1010 "User was denied access" and reads like bad
            # credentials. It is not: the credentials are fine, the transport is.
            #
            # node-postgres reads PGSSLMODE from the environment whenever the
            # config object omits `ssl`, so this fixes it without touching code.
            # `no-verify` (not `require`) because the RDS CA is not in Node's
            # trust store — plain `require` fails with "self-signed certificate
            # in certificate chain". Traffic is encrypted; the server cert is not
            # verified. Bundling the RDS CA and moving to verify-full is the
            # proper follow-up.
            #
            # Deliberately set HERE and not in docker-compose: local Postgres
            # has no TLS, so this must stay environment-scoped.
            - Name: PGSSLMODE
              Value: 'no-verify'
            - Name: REGISTRATION_ENABLED
              Value: !Ref RegistrationEnabled
          # Secrets = resolved at task start by the EXECUTION role and injected as
          # env vars. The value never appears in the template, the console, or git.
          # The app reads it exactly like any other process.env value.
          Secrets:
            - Name: SESSION_SECRET
              ValueFrom: !Ref SessionSecret
            # RDS-managed secret — the JSON has `username` and `password` keys.
            # Suffix form is <arn>:<json-key>:<version-stage>:<version-id>, the
            # last two left empty. Reading the username from the secret rather
            # than hardcoding 'appuser' keeps it correct across snapshot restores.
            - Name: DB_USER
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:username::'
                  - SecretArn:
                      Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'
            - Name: DB_PASSWORD
              ValueFrom:
                Fn::Sub:
                  - '${SecretArn}:password::'
                  - SecretArn:
                      Fn::ImportValue: !Sub '${DataStackName}-DbSecretArn'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref BackendLogGroup
              awslogs-stream-prefix: backend

  BackendService:
    DependsOn: ApiListenerRule
    Type: 'AWS::ECS::Service'
    Properties:
      # Pinned name -> deterministic ServiceName dimension for the dashboard.
      ServiceName: !Sub '${AWS::StackName}-BackendService'
      Cluster: !Ref Cluster
      # Sessions now live in Redis and all tasks share one signing secret, so
      # this is no longer forced to 1 — raise it once the single-task path is
      # verified, then prove sessions survive a bounce between tasks.
      DesiredCount: 1
      LaunchType: FARGATE
      EnableExecuteCommand: !Ref EnableExec
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref BackendTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 3000
          TargetGroupArn: !Ref BackendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: 'ENABLED'      # public subnet + public IP = no NAT gateway
          SecurityGroups:
            - !Ref ServiceSecurityGroup                              # ALB -> task (inbound)
            - Fn::ImportValue: !Sub '${DataStackName}-DbClientSgId'  # task -> DB (this is the client SG finally getting worn)
          Subnets:
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # ===================== Frontend task + service =====================
  FrontendTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: !Sub '${AWS::StackName}-frontend'
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt 'TaskExecutionRole.Arn'
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/login-demo-frontend:${FrontendImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref 'AWS::Region'
              awslogs-group: !Ref FrontendLogGroup
              awslogs-stream-prefix: frontend

  FrontendService:
    DependsOn: AppListener
    Type: 'AWS::ECS::Service'
    Properties:
      # Pinned name -> deterministic ServiceName dimension AND keeps the CD locate
      # substring 'login-demo-app-FrontendService' intact.
      ServiceName: !Sub '${AWS::StackName}-FrontendService'
      Cluster: !Ref Cluster
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref FrontendTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: 'ENABLED'
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetAId'
            - Fn::ImportValue: !Sub '${NetworkStackName}-SubnetBId'

  # ===================== Observability: SNS topic + email =====================
  # The topic is the fan-out point: alarms publish here, subscribers receive.
  # One topic, both alarms wired to it. Email is the only subscriber for now.
  AlarmTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'

  AlarmEmailSubscription:
    Condition: HasEmail
    Type: 'AWS::SNS::Subscription'
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ===================== Observability: alarms =====================
  # Alarm #1 — backend is UP but ERRORING. Fires when the backend returns more
  # than 5 HTTP 5xx responses in a single minute. Target 5xx = the app itself
  # threw 500s (a real bug), distinct from ALB 5xx (backend unreachable).
  # Metric is sparse (only emitted when 5xx happen) -> missing data = healthy.
  Backend5xxAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub '${AWS::StackName}-backend-5xx'
      AlarmDescription: 'Backend returned more than 5 HTTP 5xx responses in a minute.'
      Namespace: 'AWS/ApplicationELB'
      MetricName: 'HTTPCode_Target_5XX_Count'
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]        # also notify on recovery (all-clear email)

  # Alarm #2 — backend is DOWN / unhealthy. Fires when the backend target group
  # has zero healthy tasks for 3 straight minutes. This is the one that would
  # have caught your Stage 4 crash-loop and the health-check-path failures.
  BackendUnhealthyHostAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub '${AWS::StackName}-backend-unhealthy'
      AlarmDescription: 'Backend target group had no healthy tasks for 3 minutes.'
      Namespace: 'AWS/ApplicationELB'
      MetricName: 'HealthyHostCount'
      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # ===================== Observability: dashboard =====================
  # A saved view of metrics that already exist (ECS + ALB emit these for free).
  # Session-scoped: created and destroyed with this ephemeral stack, so it shows
  # "is this session healthy right now", not long-term trends.
  Dashboard:
    Type: 'AWS::CloudWatch::Dashboard'
    Properties:
      DashboardName: !Sub '${AWS::StackName}-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Backend errors (5xx)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "backend target 5xx" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "ALB 5xx (502/503/504)" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Backend latency (TargetResponseTime, s)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Average", "label": "avg" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p90", "label": "p90" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p99", "label": "p99" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Healthy hosts per service",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${BackendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Minimum", "label": "backend healthy" } ],
                  [ "AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${FrontendTargetGroup.TargetGroupFullName}", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Minimum", "label": "frontend healthy" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ECS CPU / Memory (%)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}", "period": 60,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-BackendService", { "stat": "Average", "label": "backend CPU%" } ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-BackendService", { "stat": "Average", "label": "backend Mem%" } ],
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-FrontendService", { "stat": "Average", "label": "frontend CPU%" } ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${AWS::StackName}-Cluster", "ServiceName", "${AWS::StackName}-FrontendService", { "stat": "Average", "label": "frontend Mem%" } ]
                ]
              }
            }
          ]
        }

Outputs:
  URL:
    Description: 'App URL (frontend at /, backend at /api/*)'
    Value: !If
      - HasCertificate
      - !Sub 'https://${LoadBalancer.DNSName}'
      - !Sub 'http://${LoadBalancer.DNSName}'

  # Named separately from URL because make-cert.sh needs the bare hostname as the
  # certificate's SAN, and stripping a scheme off URL in bash is a papercut.
  LoadBalancerDnsName:
    Description: 'ALB DNS name, with no scheme. This is the name the TLS certificate must cover.'
    Value: !GetAtt LoadBalancer.DNSName
  RedisEndpoint:
    Description: 'Redis endpoint the backend connects to'
    Value: !Sub '${RedisReplicationGroup.PrimaryEndPoint.Address}:${RedisReplicationGroup.PrimaryEndPoint.Port}'
  # The only Export this ephemeral stack publishes, and it points the dependency
  # arrow the same way as the rest: bastion -> app -> data -> network. While the
  # bastion imports it, CloudFormation refuses to delete this stack — which is
  # already the teardown order (bastion first), so the lock only ever fires when
  # you were about to do it wrong.
  RedisClientSecurityGroupId:
    Description: 'Attach this SG to anything that needs to reach Redis on 6379 (the bastion imports + attaches it to tunnel a GUI client).'
    Value: !Ref RedisClientSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-RedisClientSgId'
  SessionSecretArn:
    Description: 'Secrets Manager ARN holding the express-session signing key'
    Value: !Ref SessionSecret
  DashboardURL:
    Description: 'CloudWatch dashboard for this session'
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-dashboard'
  AlarmTopicArn:
    Description: 'SNS topic that both alarms publish to'
    Value: !Ref AlarmTopic
  MigrateTaskDefinitionFamily:
    Description: 'Family of the one-shot Prisma migration task. Run it with ./infra/run-migration.sh, which resolves subnets and the DB client SG from the stack exports, waits for the task, and reports its exit code.'
    Value: !Sub '${AWS::StackName}-migrate'
  MigrateLogGroupName:
    Description: 'CloudWatch log group for the migration task'
    Value: !Ref MigrateLogGroup