name: infra CI (reusable)

# Reusable CI for infrastructure. Not self-triggering — called by ci.yml via
# `uses:`. Validates the CloudFormation templates with cfn-lint and the helper
# shell scripts with shellcheck.
on:
  workflow_call:

jobs:
  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cfn-lint = static analysis for CloudFormation: schema, valid resource
      # properties, intrinsic-function usage, common mistakes. Catches far more
      # than the AWS service-side validate-template call.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        run: |
          set -euo pipefail
          shopt -s nullglob
          FOUND=0
          for f in infra/*.yaml infra/*.yml; do
            echo "::group::cfn-lint $f"
            cfn-lint "$f"
            echo "::endgroup::"
            FOUND=1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No CloudFormation templates found under infra/ — nothing to lint."
          fi

      # shellcheck = the same idea for shell. These scripts interpolate AWS ids
      # into command strings, where an unquoted empty variable yields a malformed
      # API call rather than an error.
      #
      # Pinned to a container rather than the runner's bundled shellcheck: the
      # bundled version moves on its own schedule, and checks are added AND
      # retired between releases (0.11 dropped SC2015, which 0.9 reports), so an
      # unpinned runner can fail on code that a newer local install calls clean.
      # Match this tag locally to reproduce CI exactly.
      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          FOUND=0
          for f in infra/*.sh; do
            echo "::group::shellcheck $f"
            docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 "$f"
            echo "::endgroup::"
            FOUND=1
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No shell scripts found under infra/ — nothing to lint."
          fi
