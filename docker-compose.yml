# Browse http://localhost:8080  — the browser only ever sees ONE origin, so the
# session cookie works with no CORS setup.
services:
  redis:
    image: redis:7-alpine
    # loopback-only: bare "6379:6379" would bind 0.0.0.0 and expose an
    # unauthenticated Redis to the local network
    ports: [ "127.0.0.1:6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: logindemo
    ports: [ "5432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d logindemo" ]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    environment:
      # any dir name under /var/www/html/designs — dracula & rmsoft_blue-dark are the dark ones
      - ADMINER_DESIGN=pepa-linha
    ports: [ "8081:8080" ]        # http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports: [ "8082:8081" ]        # http://localhost:8082
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      - PORT=3000
      - SESSION_SECRET=dev-secret-change-me
      - COOKIE_SECURE=false
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://appuser:password123@postgres:5432/logindemo
      - REGISTRATION_ENABLED=true
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"                      # http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata: { }